name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q avalon_q_supervisor tests
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Run deterministic demo
        run: python -m avalon_q_supervisor --config config.example.json --audit-log var/ci-demo.jsonl demo
